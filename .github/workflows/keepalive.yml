name: keep-streamlit-awake

on:
  schedule:
    - cron: "0 */2 * * *"   # every 2 hours (UTC)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit app
        run: |
          set -euo pipefail
          curl -L --max-time 20 -A "keepalive" "https://job-intelligence-engine.streamlit.app/" > /dev/null
