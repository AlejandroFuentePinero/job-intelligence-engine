name: keep-streamlit-awake

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (UTC)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit app
        run: |
          curl -L --max-time 20 -A "keepalive" "https://YOUR_APP_URL/" > /dev/null
